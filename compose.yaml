services:
  model-init:
    image: ${IMAGE_NAME:-x-bookmarks-library:local}
    command: ["python", "/app/manage.py", "prepare-model"]
    environment:
      HOME: /tmp
      HF_HOME: /app/models/huggingface
      FASTEMBED_CACHE_PATH: /app/models/fastembed
      HF_HUB_DISABLE_XET: "1"
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-4}
    volumes:
      - "${MODEL_VOLUME:-library-models}:/app/models"
    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true
    init: true
    pids_limit: 128
    cpus: ${APP_CPUS:-0}
    mem_limit: ${MEM_LIMIT:-0}
    memswap_limit: ${MEMSWAP_LIMIT:-0}
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    image: ${IMAGE_NAME:-x-bookmarks-library:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOME: /tmp
      DATABASE_PATH: /app/data/library.sqlite3
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_PATH: /app/data/session-secret
      SESSION_HOURS: ${SESSION_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      X_ACCOUNT_ID: ${X_ACCOUNT_ID:-}
      IMPORTS_DIR: /app/imports
      SYNC_ARCHIVE_DIR: /app/data/sync-archives
      EXTENSION_ZIP: /app/app/assets/xarchive-connector.zip
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-4}
      EMBEDDING_MIN_AVAILABLE_MIB: ${EMBEDDING_MIN_AVAILABLE_MIB:-1536}
      EMBEDDING_RLIMIT_AS_MIB: ${EMBEDDING_RLIMIT_AS_MIB:-2048}
      EMBEDDING_LOCK_PATH: /tmp/x-bookmarks-embedding.lock
      FASTEMBED_CACHE_PATH: /app/models/fastembed
      HF_HUB_DISABLE_XET: "1"
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - "${DATA_VOLUME:-library-data}:/app/data"
      - ./imports:/app/imports:ro
      - "${MODEL_VOLUME:-library-models}:/app/models"
      - "${LOG_VOLUME:-library-logs}:/app/logs"
    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true
    init: true
    pids_limit: 128
    cpus: ${APP_CPUS:-0}
    mem_limit: ${MEM_LIMIT:-0}
    memswap_limit: ${MEMSWAP_LIMIT:-0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  library-data:
  library-models:
  library-logs:
